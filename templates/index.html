<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat em Flask</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/134/134914.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(0, 100, 255);
            color: rgb(255, 255, 255);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #chat-box {
            width: 80%;
            height: 400px;
            background: rgb(210, 210, 210);
            margin-top: 20px;
            padding: 10px;
            overflow-y: scroll;
        }

        #messages {
            color: rgb(50, 50, 50);
        }

        #message-input {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            background: rgb(255, 255, 255);
            border: none;
            color: rgb(50, 50, 50);
        }

        #inputs{
            display: flex;
            flex-direction: row;
            width: 90%;
            justify-content: center;
            margin-top: 5px;
        }

        #enviarbtn {
            margin-top: 10px;
            margin-left: 5px;
            padding: 10px;
            background: rgb(255, 255, 255);
            color: rgb(0, 100, 255);
            border: 1px solid rgb(255, 255, 255);
            cursor: pointer;
        }

        #enviarbtn:hover {
            background: rgb(0, 100, 255);
            color: rgb(255, 255, 255);
            border: 1px solid rgb(255, 255, 255);
        }

    </style>
</head>
<body>

    <h2>Chat em Flask</h2>
    <img src="../Static/IMG/logo.png" alt="" srcset="">

    <div id="chat-box">  
        <div id="messages"></div>
    </div>

    <div id="inputs">
        <input type="text" id="message-input" placeholder="Digite uma mensagem...">
        <input type="button" id="enviarbtn" onclick="sendMessage()" value="Enviar">
    </div>
       


    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        var socket = io();

        // Evento para exibir as mensagens
        socket.on('message', function(msg) {
            var messageDiv = document.getElementById('messages');
            messageDiv.innerHTML += `<div>${msg}</div>`;
        });

        function sendMessage() {
            var messageInput = document.getElementById('message-input');
            var message = messageInput.value;
            socket.send(message);
            messageInput.value = '';
        }

        // Enviar mensagem
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Função para enviar um emoji
        function sendEmoji(emoji) {
            socket.emit('message', emoji);
        }

    </script>
</body>
</html>
